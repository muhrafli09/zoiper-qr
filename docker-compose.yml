services:
  nginx:
    image: nginx:alpine
    container_name: zoiper-qr-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:80"
    volumes:
      - /opt/docker-apps/zoiper-qr-code:/usr/share/nginx/html
      - /opt/docker-apps/zoiper-qr-code/docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - zoiper-network
      - proxy

networks:
  zoiper-network:
    driver: bridge
  proxy:
    external: true
    name: proxy-network
